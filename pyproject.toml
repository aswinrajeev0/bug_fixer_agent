[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healcode"
version = "0.1.0"
description = "Self-Healing Bug Fixer & Test Agent powered by Google Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.1.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
healcode = "healcode.cli:main"
autoheal = "healcode.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
